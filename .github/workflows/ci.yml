name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # No model calls in PR CI.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Action bundle is up to date
        run: npm run build:action && git diff --exit-code action/

  action:
    # Runs the Action on the example: the broken hook must fail on Claude Code 2.1.63,
    # and the fixed hook must pass, so a crash or config error cannot look like a catch.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - id: replay
        uses: ./
        continue-on-error: true
        with:
          config: examples/consumer/hookcompat.yml
      - if: steps.replay.outcome != 'failure'
        run: echo "expected the example to fail on Claude Code 2.1.63" && exit 1
      - uses: ./
        with:
          config: examples/consumer/hookcompat.fixed.yml
